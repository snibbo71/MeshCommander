name: MeshCommanderMac
options:
  bundleIdPrefix: com.meshcommander
  deploymentTarget:
    macOS: "12.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Release: Configs/Release.xcconfig
targets:
  MeshCommanderMac:
    type: application
    platform: macOS
    sources:
      - path: MeshCommanderMac/main.swift
      - path: MeshCommanderMac/AppDelegate.swift
      - path: MeshCommanderMac/MainWindowController.swift
      - path: MeshCommanderMac/WebViewController.swift
      - path: MeshCommanderMac/NetworkBridge.swift
      - path: MeshCommanderMac/DatagramBridge.swift
      - path: MeshCommanderMac/MenuBridge.swift
      - path: MeshCommanderMac/FileBridge.swift
      - path: MeshCommanderMac/CertificateFingerprint.swift
      - path: MeshCommanderMac/AppIcon.icns
        optional: true
        buildPhase: resources
      - path: MeshCommanderMac/Resources
        type: folder
        buildPhase: resources
    info:
      path: MeshCommanderMac/Info.plist
      properties:
        CFBundleDisplayName: MeshCommanderAS
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright Intel Corporation
        NSHighResolutionCapable: true
    entitlements:
      path: MeshCommanderMac/MeshCommanderMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meshcommander.mac
        PRODUCT_NAME: MeshCommanderAS
        # Single source of truth for the app's version - build-html.js reads this same
        # value and stamps it into every generated HTML bundle's `var version` (index.html
        # otherwise hardcodes its own, independently-drifted '0.9.7'/'1.2.0'), so the About
        # panel/Finder "Get Info" and the in-app UI header always agree.
        MARKETING_VERSION: "0.9.7"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: false
        # Apple Silicon only - there's no point shipping an Intel slice since the
        # existing NW.js build already covers Intel Macs. Explicit rather than
        # relying on ARCHS_STANDARD's default, which includes x86_64 for Release
        # archives (ONLY_ACTIVE_ARCH only narrows Debug builds to the host arch).
        ARCHS: arm64
        VALID_ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: false
        Release:
          # CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM come from Configs/Release.xcconfig
          # (see Configs/Release.xcconfig.example) - not hardcoded here since they're
          # account-specific and that file is gitignored.
          ENABLE_HARDENED_RUNTIME: true
